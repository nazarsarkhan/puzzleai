[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzle-pipeline"
version = "0.1.0"
description = "Deterministic Roblox puzzle asset compiler"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
web = [
  "fastapi>=0.115",
  "openai>=1.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.scripts]
puzzle = "puzzle_pipeline.cli.main:main"
puzzle-web = "puzzle_pipeline.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "blender: requires an installed Blender executable",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = "tests"

[tool.coverage.run]
source = ["puzzle_pipeline"]
